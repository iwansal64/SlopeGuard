[package]
name = "slopeguard-dashboard"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "slopeguard-dashboard"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["derive"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
slopeguard = { path = "../slopeguard" }
